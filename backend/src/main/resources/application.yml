server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/boss_recruit_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf-8
    username: root
    password: YourDatabaseSecurePassword123!
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# Custom JWT configuration (7 Days secret authorization constant)
app:
  jwt:
    secret: d29ya2luZ2hhcmRwb3dlcmZ1bGFpY29kaW5nYnJhbmRuZXdzZWNyZXRrZXlzdHJpbmdmb3JiZXN0cmVjcnVpdGFwcGxpY2F0aW9uY29tcGF0aWJpbGl0eTIwMjY=
    expirationMs: 604800000 # 7 days (7 * 24 * 60 * 60 * 1000)

logging:
  level:
    root: INFO
    com.boss.recruit: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
