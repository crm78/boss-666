name: iOS Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npx vite build

      - name: Add iOS platform
        run: |
          rm -rf ios
          npx cap add ios
          ls ios/App/

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build archive
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration ${{ github.event.inputs.configuration }} \
            -archivePath ${{ runner.temp }}/App.xcarchive \
            -destination 'generic/platform=iOS' \
            archive \
            CODE_SIGNING_ALLOWED=NO 2>&1 || true
          echo "=== EXIT CODE: $? ==="
          echo "=== Archive contents ==="
          ls -la ${{ runner.temp }}/App.xcarchive/Products/Applications/ 2>/dev/null || echo "No archive output"

      - name: Package IPA
        run: |
          if [ -d "${{ runner.temp }}/App.xcarchive/Products/Applications/App.app" ]; then
            mkdir -p ${{ runner.temp }}/ipa/Payload
            cp -r ${{ runner.temp }}/App.xcarchive/Products/Applications/App.app ${{ runner.temp }}/ipa/Payload/
            cd ${{ runner.temp }}/ipa
            zip -r App.ipa Payload -q
            echo "IPA created successfully"
            ls -lh App.ipa
          else
            echo "App.app not found - build failed"
            ls -la ${{ runner.temp }}/App.xcarchive/Products/Applications/ 2>/dev/null || echo "No applications found"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-${{ github.event.inputs.configuration }}.ipa
          path: ${{ runner.temp }}/ipa/App.ipa
