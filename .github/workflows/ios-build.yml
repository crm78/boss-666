name: iOS Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npx vite build

      - name: Add iOS platform
        run: |
          rm -rf ios
          npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build app (unsigned)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration ${{ github.event.inputs.configuration }} \
            -derivedDataPath ${{ runner.temp }}/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log
          EXIT_CODE=$?
          echo ""
          echo "=== LAST 50 LINES OF XCODEBUILD OUTPUT ==="
          tail -50 xcodebuild.log
          echo ""
          echo "=== SEARCHING FOR ERRORS ==="
          grep -E "error:|FAILED|fatal error" xcodebuild.log || echo "No standard error patterns found"
          grep -E ":[0-9]+:[0-9]+: error:" xcodebuild.log || echo "No line-specific errors found"
          exit $EXIT_CODE

      - name: Package IPA (if build succeeded)
        if: success()
        run: |
          mkdir -p ${{ runner.temp }}/ipa/Payload
          cp -r ${{ runner.temp }}/DerivedData/Build/Products/${{ github.event.inputs.configuration }}-iphoneos/App.app ${{ runner.temp }}/ipa/Payload/
          cd ${{ runner.temp }}/ipa
          zip -r App.ipa Payload -q
          ls -lh App.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: App-${{ github.event.inputs.configuration }}.ipa
          path: ${{ runner.temp }}/ipa/App.ipa
