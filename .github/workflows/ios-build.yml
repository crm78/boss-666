name: iOS Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npx vite build

      - name: Remove stale ios directory
        run: rm -rf ios

      - name: Add iOS platform
        run: npx cap add ios

      - name: Debug - list ios/App contents
        run: find ios -type f -maxdepth 4

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Debug - check for xcworkspace
        run: |
          echo "=== Looking for .xcworkspace ==="
          find ios -name "*.xcworkspace" 2>/dev/null
          echo "=== Looking for .xcodeproj ==="
          find ios -name "*.xcodeproj" 2>/dev/null
          echo "=== ios/App full tree ==="
          ls -la ios/App/

      - name: Build app (unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration ${{ github.event.inputs.configuration }} \
            -derivedDataPath ${{ runner.temp }}/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p ${{ runner.temp }}/ipa/Payload
          cp -r ${{ runner.temp }}/DerivedData/Build/Products/${{ github.event.inputs.configuration }}-iphoneos/App.app ${{ runner.temp }}/ipa/Payload/
          cd ${{ runner.temp }}/ipa
          zip -r App.ipa Payload -q

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-${{ github.event.inputs.configuration }}.ipa
          path: ${{ runner.temp }}/ipa/App.ipa
