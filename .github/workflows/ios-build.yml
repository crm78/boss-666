name: iOS Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npx vite build

      - name: Initialize iOS platform
        run: |
          rm -rf ios
          echo "=== Running cap add ios ==="
          npx cap add ios 2>&1
          CAP_EXIT=$?
          echo "cap add ios exit code: $CAP_EXIT"
          if [ $CAP_EXIT -ne 0 ]; then
            echo "cap add ios failed, trying direct binary..."
            ./node_modules/.bin/cap add ios 2>&1
          fi
          echo "=== Verifying ios/App contents ==="
          ls -la ios/App/
          echo "=== Looking for .xcworkspace ==="
          find ios -name "*.xcworkspace" -maxdepth 3

      - name: Ensure workspace exists
        run: |
          if [ ! -f ios/App/App.xcworkspace ]; then
            echo "=== App.xcworkspace missing! Attempting repair... ==="
            ls -la ios/App/
            # Try to regenerate just the workspace
            npx cap sync ios 2>&1
            find ios -name "*.xcworkspace" -maxdepth 3
          fi
          if [ ! -f ios/App/App.xcworkspace ]; then
            echo "FATAL: App.xcworkspace could not be created"
            exit 1
          fi

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document 2>&1 | tail -3
          cd ios/App && pod install --repo-update 2>&1 | tail -5

      - name: Build app (unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration ${{ github.event.inputs.configuration }} \
            -derivedDataPath ${{ runner.temp }}/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO 2>&1

      - name: Package IPA
        run: |
          mkdir -p ${{ runner.temp }}/ipa/Payload
          cp -r ${{ runner.temp }}/DerivedData/Build/Products/${{ github.event.inputs.configuration }}-iphoneos/App.app ${{ runner.temp }}/ipa/Payload/
          cd ${{ runner.temp }}/ipa
          zip -r App.ipa Payload -q
          echo "=== IPA size ==="
          ls -lh App.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-${{ github.event.inputs.configuration }}.ipa
          path: ${{ runner.temp }}/ipa/App.ipa
