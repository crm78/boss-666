name: iOS Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npx vite build

      - name: Add iOS platform
        run: |
          rm -rf ios
          npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build app
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration ${{ github.event.inputs.configuration }} \
            -derivedDataPath ${{ runner.temp }}/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO 2>&1

      - name: Package IPA
        run: |
          APP_PATH=$(find ${{ runner.temp }}/DerivedData -name "App.app" -type d -path "*/${{ github.event.inputs.configuration }}-iphoneos/*" | head -1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "App.app not found in build products"
            find ${{ runner.temp }}/DerivedData -name "*.app" -maxdepth 6
            exit 1
          fi
          mkdir -p ${{ runner.temp }}/ipa/Payload
          ditto "$APP_PATH" "${{ runner.temp }}/ipa/Payload/App.app"
          cd ${{ runner.temp }}/ipa
          zip -r -X App.ipa Payload/ -q
          echo "IPA size:"
          ls -lh App.ipa
          echo "IPA contents:"
          unzip -l App.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-${{ github.event.inputs.configuration }}.ipa
          path: ${{ runner.temp }}/ipa/App.ipa
